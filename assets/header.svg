<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="1000" height="280" fill="none" role="img" aria-label="Kaio - Fullstack Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"><animate attributeName="stop-color" values="#38bdf8;#a78bfa;#22d3ee;#38bdf8" dur="8s" repeatCount="indefinite"/></stop>
      <stop offset="100%" stop-color="#a78bfa"><animate attributeName="stop-color" values="#a78bfa;#22d3ee;#38bdf8;#a78bfa" dur="8s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#a78bfa" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="blur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="55"/></filter>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" stroke="#1e293b" stroke-width="1" fill="none" opacity="0.55"/>
    </pattern>
    <clipPath id="card"><rect x="1" y="1" width="998" height="278" rx="18"/></clipPath>
  </defs>

  <rect width="1000" height="280" rx="18" fill="url(#bg)"/>
  <g clip-path="url(#card)">
    <rect width="1000" height="280" fill="url(#grid)"/>
    <circle cx="180" cy="70" r="120" fill="#38bdf8" opacity="0.20" filter="url(#blur)">
      <animate attributeName="cx" values="180;340;180" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="70;200;70" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="800" cy="210" r="130" fill="#a78bfa" opacity="0.20" filter="url(#blur)">
      <animate attributeName="cx" values="800;640;800" dur="16s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="210;60;210" dur="13s" repeatCount="indefinite"/>
    </circle>
    <circle cx="520" cy="140" r="100" fill="#22d3ee" opacity="0.14" filter="url(#blur)">
      <animate attributeName="cy" values="140;40;140" dur="10s" repeatCount="indefinite"/>
    </circle>

    <g fill="#64748b" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="13">
      <circle cx="34" cy="34" r="6" fill="#ff5f57"/><circle cx="56" cy="34" r="6" fill="#febc2e"/><circle cx="78" cy="34" r="6" fill="#28c840"/>
      <text x="102" y="39">kaio@dev — zsh</text>
    </g>
    <line x1="0" y1="60" x2="1000" y2="60" stroke="#1e293b" stroke-width="1"/>

    <text x="34" y="122" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="15" fill="#38bdf8">$</text>
    <text x="56" y="122" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="15" fill="#94a3b8">whoami</text>

    <text x="34" y="188" font-family="'JetBrains Mono',ui-monospace,monospace" font-weight="700" font-size="52" fill="url(#title)" filter="url(#glow)">KAIO</text>

    <text x="36" y="228" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="16" fill="#94a3b8">
      <tspan fill="#a78bfa">const</tspan> <tspan fill="#e2e8f0">stack</tspan> = [<tspan fill="#7dd3fc">'C#/.NET'</tspan>, <tspan fill="#7dd3fc">'Node.js'</tspan>, <tspan fill="#7dd3fc">'React'</tspan>, <tspan fill="#7dd3fc">'ESP32'</tspan>];
    </text>
    <rect x="578" y="214" width="9" height="18" fill="#38bdf8">
      <animate attributeName="opacity" values="1;1;0;0;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>

    <g font-family="'JetBrains Mono',ui-monospace,monospace" font-size="13" fill="#475569" text-anchor="end">
      <text x="966" y="122">fullstack · apis · iot</text>
      <text x="966" y="146" fill="#38bdf8" opacity="0.8">building things that scale</text>
    </g>
  </g>
  <rect x="1" y="1" width="998" height="278" rx="18" fill="none" stroke="url(#stroke)" stroke-width="1.5">
    <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="4s" repeatCount="indefinite"/>
  </rect>
</svg>
